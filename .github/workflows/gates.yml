name: ops-gates

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml ansible
      - name: Tag and subtag compliance
        run: python scripts/check_ansible_tags.py
      - name: Role docs compliance
        run: python scripts/check_doc_compliance.py
