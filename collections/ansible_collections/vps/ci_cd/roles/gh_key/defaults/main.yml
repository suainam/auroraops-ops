---
# =============================================================================
# Role: vps.ci_cd.gh_key - GitHub Deploy Key Configuration
# =============================================================================
# 为 VPS 配置 GitHub Deploy Key，使其能够克隆和拉取私有仓库
#
# 设计原则:
#   - 🔐 安全: 使用 ED25519 密钥，权限最小化
#   - 🤖 自动化: 通过 GitHub API 自动添加密钥
#   - 🔄 幂等性: 重复执行不会产生副作用
#   - 📝 可追溯: 密钥标题包含主机名和时间戳
# =============================================================================

# -----------------------------------------------------------------------------
# 必需变量 (需要在 group_vars 或 host_vars 中定义)
# -----------------------------------------------------------------------------
# gh_key_repo: "owner/repo"                    # GitHub 仓库
# gh_key_token: "{{ lookup('vps.services.vaultwarden', 'AuroraOps/GitHub/auroraops-pat', field='notes') }}"

# -----------------------------------------------------------------------------
# 密钥配置
# -----------------------------------------------------------------------------
gh_key_path: "~/.ssh/github_ed25519" # 密钥文件路径
gh_key_type: "ed25519" # 密钥类型 (ed25519/rsa)
gh_key_comment: "{{ ansible_user_id }}@{{ ansible_hostname }}.{{ inventory_hostname }}" # 密钥注释
gh_key_read_only: false # 是否只读 (false 允许推送)

# -----------------------------------------------------------------------------
# SSH 配置
# -----------------------------------------------------------------------------
gh_key_ssh_config_path: "~/.ssh/config" # SSH config 文件路径
gh_key_ssh_host: "github.com" # GitHub 主机名
gh_key_ssh_user: "git" # GitHub SSH 用户

# -----------------------------------------------------------------------------
# 仓库克隆配置
# -----------------------------------------------------------------------------
gh_key_clone_repo: true # 是否克隆仓库
gh_key_clone_dest: "~/AuroraOps" # 克隆目标路径
gh_key_clone_version: "main" # 克隆分支

# -----------------------------------------------------------------------------
# GitHub API 配置
# -----------------------------------------------------------------------------
gh_key_api_base_url: "https://api.github.com" # GitHub API 基础 URL
gh_key_api_timeout: 30 # API 请求超时时间 (秒)

# -----------------------------------------------------------------------------
# 内部变量 (不要修改)
# -----------------------------------------------------------------------------
gh_key_public_key_path: "{{ gh_key_path }}.pub"
gh_key_deploy_key_title: "AuroraOps {{ inventory_hostname }} - {{ ansible_date_time.iso8601 }}"
