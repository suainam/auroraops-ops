---
- name: 卸载控制端 LaunchAgent (Darwin Controller)
  delegate_to: localhost
  ansible.builtin.shell: |
    launchctl unload "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/com.auroraops.instabox-scheduler.plist" 2>/dev/null || true
  tags: [rollback, observability, auroraops_monitor]

- name: 移除控制端 LaunchAgent plist
  delegate_to: localhost
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/Library/LaunchAgents/com.auroraops.instabox-scheduler.plist"
    state: absent
  tags: [rollback, observability, auroraops_monitor]
