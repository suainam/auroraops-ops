---
# Stage 7: Rollback (Fault Simulation & Reversal)
# Restores host to exact pre-deployment state while preserving un-ACKed data.

- name: 停止并卸载控制端 LaunchAgent 定时调度器 (消除并发写窗口)
  ansible.builtin.include_tasks: controller_scheduler_rollback.yml
  when: auroraops_monitor_mode != 'aggregator'
  tags: [rollback, observability, auroraops_monitor]

- name: 卸载控制端 cc15-spool-pusher LaunchAgent (Darwin Controller)
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/../../../common/tasks/managed_timer.yml"
  vars:
    timer_name: "com.auroraops.cc15-spool-pusher"
    timer_exec_start: "{{ lookup('env', 'HOME') }}/.auroraops/bin/cc15_spool_pusher.py"
    timer_init_system: "darwin"
    timer_enabled: false
    timer_state: stopped
  when: auroraops_monitor_mode == 'aggregator'
  tags: [rollback, observability, auroraops_monitor]

- name: 停止并禁用 weekly report systemd timer 与 service (Aggregator)
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - auroraops_weekly_report.timer
    - auroraops_weekly_report.service
    - auroraops_cf_collector.timer
    - auroraops_cf_collector.service
  failed_when: false
  when: auroraops_monitor_mode == 'aggregator'
  tags: [rollback, observability, auroraops_monitor]

- name: 移除 weekly report systemd unit 与环境配置文件 (Aggregator)
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/auroraops_weekly_report.timer
    - /etc/systemd/system/auroraops_weekly_report.service
    - /etc/systemd/system/auroraops_cf_collector.timer
    - /etc/systemd/system/auroraops_cf_collector.service
    - /etc/auroraops/auroraops_monitor.env
  when: auroraops_monitor_mode == 'aggregator'
  tags: [rollback, observability, auroraops_monitor]

- name: 重载 systemd daemon (Aggregator)
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  when: auroraops_monitor_mode == 'aggregator'
  tags: [rollback, observability, auroraops_monitor]

- name: 停止并禁用 systemd timer 与 service (Host Metrics)
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - auroraops-monitor.timer
    - auroraops-monitor.service
  failed_when: false
  when: auroraops_monitor_mode == 'host_metrics'
  tags: [rollback, observability, auroraops_monitor]

- name: 移除 systemd unit 文件 (Host Metrics)
  become: true
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - auroraops-monitor.timer
    - auroraops-monitor.service
  when: auroraops_monitor_mode == 'host_metrics'
  tags: [rollback, observability, auroraops_monitor]

- name: 重载 systemd daemon (Host Metrics)
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  when: auroraops_monitor_mode == 'host_metrics'
  tags: [rollback, observability, auroraops_monitor]

- name: 移除受限命令防护脚本 (qqg1299)
  become: true
  ansible.builtin.file:
    path: /usr/local/bin/auroraops_spool_puller_guard.py
    state: absent
  when: auroraops_monitor_mode == 'host_metrics'
  tags: [rollback, observability, auroraops_monitor]

- name: 移除历史受限命令防护脚本 (若存在)
  become: true
  ansible.builtin.file:
    path: /usr/local/bin/auroraops_spool_puller_guard.sh
    state: absent
  when: auroraops_monitor_mode == 'host_metrics'
  tags: [rollback, observability, auroraops_monitor]


- name: 检查 Baseline Fact 是否存在
  become: true
  ansible.builtin.stat:
    path: "{{ auroraops_monitor_fact_path }}"
  register: auroraops_monitor_rollback_fact_stat
  tags: [rollback, observability, auroraops_monitor]

- name: 读取 Baseline Fact 以供回滚
  become: true
  ansible.builtin.slurp:
    path: "{{ auroraops_monitor_fact_path }}"
  register: auroraops_monitor_rollback_fact_raw
  when: auroraops_monitor_rollback_fact_stat.stat.exists
  tags: [rollback, observability, auroraops_monitor]

- name: 解析 Baseline Fact
  ansible.builtin.set_fact:
    auroraops_monitor_baseline: "{{ auroraops_monitor_rollback_fact_raw.content | b64decode | from_json }}"
  when: auroraops_monitor_rollback_fact_stat.stat.exists
  tags: [rollback, observability, auroraops_monitor]

- name: 安全护栏 — 验证待清理路径严格受限
  ansible.builtin.assert:
    that:
      - auroraops_monitor_dir in ['/data/home/auroraops-monitor', '/var/lib/auroraops-monitor']
      - auroraops_monitor_dir is match('^(/data/home|/var/lib)/[a-zA-Z0-9_\-]+$')
    fail_msg: "拒绝回滚: auroraops_monitor_dir 路径不符合严格白名单，防止破坏上级或系统目录"
  tags: [rollback, observability, auroraops_monitor]

- name: 检查是否存在未 ACK 的持久 Spool 数据
  become: true
  ansible.builtin.shell: |
    set -e
    if [ -d "{{ auroraops_monitor_dir }}/spool" ] && [ "$(ls -A {{ auroraops_monitor_dir }}/spool 2>/dev/null)" ]; then
      echo "has_unacked_sealed"
    elif [ -d "{{ auroraops_monitor_dir }}/spool_inbound" ] && [ "$(find {{ auroraops_monitor_dir }}/spool_inbound -type f 2>/dev/null)" ]; then
      echo "has_unacked_inbound"
    elif [ -d "{{ auroraops_monitor_dir }}/cf_history" ] && [ "$(ls -A {{ auroraops_monitor_dir }}/cf_history 2>/dev/null)" ]; then
      echo "has_unacked_history"
    elif [ -d "{{ auroraops_monitor_dir }}/reports" ] && [ "$(ls -A {{ auroraops_monitor_dir }}/reports 2>/dev/null)" ]; then
      echo "has_unacked_reports"
    elif [ -f "{{ auroraops_monitor_spool_file }}" ] && [ -s "{{ auroraops_monitor_spool_file }}" ]; then
      echo "has_unacked_active"
    else
      echo "clean"
    fi
  register: auroraops_monitor_unacked_check
  changed_when: false
  when: auroraops_monitor_rollback_fact_stat.stat.exists
  tags: [rollback, observability, auroraops_monitor]

- name: 持锁安全隔离并保全未 ACK 的 Spool 数据 (严禁丢数据，零吞错)
  become: true
  args:
    executable: /bin/bash
  ansible.builtin.shell: |
    set -euo pipefail
    archive_dir="{{ auroraops_monitor_unacked_archive_dir }}"
    mkdir -p "$archive_dir"
    chmod 700 "$archive_dir"
    chown root:root "$archive_dir"

    lock_file="{{ auroraops_monitor_dir }}/spool.lock"
    touch "$lock_file"

    flock -x "$lock_file" bash -euo pipefail -c '
      archive="$1"
      monitor_dir="$2"
      spool_file="$3"
      spool_dir="$monitor_dir/spool"

      for sub in spool spool_inbound cf_history reports; do
        sdir="$monitor_dir/$sub"
        if [ -d "$sdir" ] && [ "$(ls -A "$sdir" 2>/dev/null)" ]; then
          mkdir -p "$archive/$sub"
          cp -a "$sdir"/* "$archive/$sub/" 2>/dev/null || true
        fi
      done

      if [ -f "$spool_file" ] && [ -s "$spool_file" ]; then
        ts=$(date +%s)
        dest="$archive/spool-preserved-${ts}.jsonl"
        cp -a "$spool_file" "$dest"
        python3 -c '\''import os, sys; fd = os.open(sys.argv[1], os.O_RDONLY); os.fsync(fd); os.close(fd)'\'' "$dest"
      fi

      # fsync target directory
      python3 -c '\''import os, sys; fd = os.open(sys.argv[1], os.O_RDONLY); os.fsync(fd); os.close(fd)'\'' "$archive"

      # All copied files and target dir fsync succeeded; delete archived source files
      if [ -d "$spool_dir" ]; then
        rm -rf "${spool_dir:?}"/*
      fi
      if [ -f "$spool_file" ]; then
        rm -f "$spool_file"
      fi
    ' _ "$archive_dir" "{{ auroraops_monitor_dir }}" "{{ auroraops_monitor_spool_file }}"
  when:
    - auroraops_monitor_rollback_fact_stat.stat.exists
    - auroraops_monitor_unacked_check.stdout is defined
    - auroraops_monitor_unacked_check.stdout != 'clean'
  tags: [rollback, observability, auroraops_monitor]

- name: 按 Baseline Manifest 恢复或删除逐文件基线
  become: true
  args:
    executable: /bin/bash
  ansible.builtin.shell: |
    set -euo pipefail
    python3 -c '
    import os, sys, json, shutil, stat

    fact_path = sys.argv[1]
    monitor_dir = sys.argv[2]
    backup_dir = sys.argv[3]
    audit_path = sys.argv[4]

    with open(fact_path, "r") as f:
        fact = json.load(f)

    # Save copy to audit path for rollback_verify before removing fact
    with open(audit_path, "w") as f:
        json.dump(fact, f, indent=2)

    files_manifest = fact.get("files")
    dir_meta = fact.get("dir_metadata", {})
    spool_dir_meta = fact.get("spool_dir_metadata", {})
    pre_dir_exists = fact.get("pre_deploy_dir_exists", False)

    scripts = ["spool_manager.py", "auroraops_probe.py", "ipquality_geo_probe.py", "auroraops_host_sampler.py", "auroraops_aggregator.py"]
    runtime_files = ["spool.lock", "spool.jsonl", "metrics.jsonl", "geo_audit_cursor.json", "cf_token.json"]

    if files_manifest:
        # Per-file manifest restoration
        for s in scripts:
            target = os.path.join(monitor_dir, s)
            info = files_manifest.get(s, {})
            if info.get("pre_exists", False):
                src = os.path.join(backup_dir, s)
                if os.path.exists(src):
                    shutil.copy2(src, target)
                    if "mode" in info:
                        os.chmod(target, int(info["mode"], 8))
                    if "uid" in info and "gid" in info:
                        try:
                            os.chown(target, info["uid"], info["gid"])
                        except Exception:
                            pass
            else:
                if os.path.lexists(target):
                    os.remove(target)

        for rf in runtime_files:
            target = os.path.join(monitor_dir, rf)
            info = files_manifest.get(rf, {})
            if not info.get("pre_exists", False) and os.path.lexists(target):
                os.remove(target)


        # Restore or remove system files
        system_files = fact.get("system_files", {})
        for sf_path, sf_meta in system_files.items():
            sf_name = f"sys_{os.path.basename(sf_path)}"
            src_sf = os.path.join(backup_dir, sf_name)
            if sf_meta.get("pre_exists", False) and os.path.exists(src_sf):
                os.makedirs(os.path.dirname(sf_path), exist_ok=True)
                shutil.copy2(src_sf, sf_path)
                if "mode" in sf_meta:
                    os.chmod(sf_path, int(sf_meta["mode"], 8))
            else:
                if os.path.lexists(sf_path):
                    os.remove(sf_path)
        # Restore or remove spool directory
        spool_path = os.path.join(monitor_dir, "spool")
        if spool_dir_meta.get("exists", False):
            if "mode" in spool_dir_meta:
                os.chmod(spool_path, int(spool_dir_meta["mode"], 8))
            if "uid" in spool_dir_meta and "gid" in spool_dir_meta:
                try:
                    os.chown(spool_path, spool_dir_meta["uid"], spool_dir_meta["gid"])
                except Exception:
                    pass
        else:
            if os.path.exists(spool_path):
                shutil.rmtree(spool_path)

        # Restore or remove monitor directory
        if dir_meta.get("exists", pre_dir_exists):
            if "mode" in dir_meta:
                os.chmod(monitor_dir, int(dir_meta["mode"], 8))
            if "uid" in dir_meta and "gid" in dir_meta:
                try:
                    os.chown(monitor_dir, dir_meta["uid"], dir_meta["gid"])
                except Exception:
                    pass
        else:
            archive_dir = sys.argv[5] if len(sys.argv) > 5 else None
            if archive_dir and os.path.exists(monitor_dir):
                for sub in ["spool", "spool_inbound", "cf_history", "reports"]:
                    sdir = os.path.join(monitor_dir, sub)
                    if os.path.isdir(sdir) and os.listdir(sdir):
                        dest = os.path.join(archive_dir, sub)
                        shutil.copytree(sdir, dest, dirs_exist_ok=True)
            if os.path.exists(monitor_dir):
                shutil.rmtree(monitor_dir)
    else:
        # Fallback for version 1 baseline
        if os.path.isdir(backup_dir):
            for item in os.listdir(backup_dir):
                src = os.path.join(backup_dir, item)
                if os.path.isfile(src):
                    shutil.copy2(src, os.path.join(monitor_dir, item))
        if not pre_dir_exists:
            for s in scripts + runtime_files:
                p = os.path.join(monitor_dir, s)
                if os.path.lexists(p):
                    os.remove(p)
            spool_path = os.path.join(monitor_dir, "spool")
            if os.path.exists(spool_path):
                shutil.rmtree(spool_path)
            if os.path.exists(monitor_dir):
                shutil.rmtree(monitor_dir)

    if os.path.exists(backup_dir):
        shutil.rmtree(backup_dir)
    ' "{{ auroraops_monitor_fact_path }}" "{{ auroraops_monitor_dir }}" "{{ auroraops_monitor_backup_dir }}" "{{ auroraops_monitor_audit_file }}" "{{ auroraops_monitor_unacked_archive_dir }}"
  when: auroraops_monitor_rollback_fact_stat.stat.exists
  tags: [rollback, observability, auroraops_monitor]

- name: 清理 Baseline Fact 记录
  become: true
  ansible.builtin.file:
    path: "{{ auroraops_monitor_fact_path }}"
    state: absent
  when: auroraops_monitor_rollback_fact_stat.stat.exists
  tags: [rollback, observability, auroraops_monitor]

- name: 移除专用非特权系统用户 (Host Metrics & Aggregator)
  become: true
  ansible.builtin.user:
    name: "{{ auroraops_monitor_user }}"
    state: absent
  when:
    - auroraops_monitor_mode in ['host_metrics', 'aggregator']
    - not (auroraops_monitor_baseline.user_pre_exists | default(false))

- name: 移除专用非特权系统组 (Host Metrics & Aggregator)
  become: true
  ansible.builtin.group:
    name: "{{ auroraops_monitor_group }}"
    state: absent
  failed_when: false
  when:
    - auroraops_monitor_mode in ['host_metrics', 'aggregator']
    - not (auroraops_monitor_baseline.group_pre_exists | default(false))
