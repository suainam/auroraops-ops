---
# Stage 8: Rollback Verify (Old-State Audit)
# Independently asserts host reverted to pre-deployment baseline.

- name: 验证 Baseline Fact 已被清除
  become: true
  ansible.builtin.stat:
    path: "{{ auroraops_monitor_fact_path }}"
  register: auroraops_monitor_post_rb_fact
  tags: [rollback_verify, observability, auroraops_monitor]

- name: 断言 Baseline Fact 确实不存在
  ansible.builtin.assert:
    that:
      - not auroraops_monitor_post_rb_fact.stat.exists
    fail_msg: "回滚失败: {{ auroraops_monitor_fact_path }} 仍然残留"
  tags: [rollback_verify, observability, auroraops_monitor]

- name: 依据 Manifest 审计验证工作目录与文件回滚终态 (非虚断言)
  become: true
  args:
    executable: /bin/bash
  ansible.builtin.shell: |
    set -euo pipefail
    python3 -c '
    import os, sys, json, stat

    audit_path = sys.argv[1]
    monitor_dir = sys.argv[2]

    if not os.path.exists(audit_path):
        # Fallback when audit file absent: assert monitor_dir is absent
        assert not os.path.exists(monitor_dir), f"{monitor_dir} still exists without audit baseline"
        sys.exit(0)

    with open(audit_path, "r") as f:
        fact = json.load(f)

    files_manifest = fact.get("files")
    dir_meta = fact.get("dir_metadata", {})
    pre_dir_exists = fact.get("pre_deploy_dir_exists", False)

    scripts = ["spool_manager.py", "auroraops_probe.py", "ipquality_geo_probe.py", "auroraops_host_sampler.py", "auroraops_aggregator.py"]
    runtime_files = ["spool.lock", "spool.jsonl", "metrics.jsonl", "geo_audit_cursor.json", "cf_token.json"]

    if not dir_meta.get("exists", pre_dir_exists):
        assert not os.path.exists(monitor_dir), f"Directory {monitor_dir} should be absent but exists"
    else:
        assert os.path.isdir(monitor_dir), f"Directory {monitor_dir} should exist but does not"
        if "mode" in dir_meta:
            curr_mode = oct(stat.S_IMODE(os.stat(monitor_dir).st_mode))
            expected_dir_mode = dir_meta.get("mode")
            assert curr_mode == expected_dir_mode, f"Mode mismatch on {monitor_dir}: {curr_mode} vs {expected_dir_mode}"

        if files_manifest:
            for s in scripts:
                target = os.path.join(monitor_dir, s)
                info = files_manifest.get(s, {})
                if info.get("pre_exists", False):
                    assert os.path.isfile(target), f"Script {target} was pre-existing but is absent"
                    if "mode" in info:
                        curr_mode = oct(stat.S_IMODE(os.stat(target).st_mode))
                        expected_script_mode = info.get("mode")
                        assert curr_mode == expected_script_mode, f"Mode mismatch on {target}: {curr_mode} vs {expected_script_mode}"
                else:
                    assert not os.path.lexists(target), f"Script {target} was newly deployed and should be absent"

            for rf in runtime_files:
                target = os.path.join(monitor_dir, rf)
                info = files_manifest.get(rf, {})
                if not info.get("pre_exists", False):
                    assert not os.path.lexists(target), f"Runtime file {target} should be absent"
    ' "{{ auroraops_monitor_audit_file }}" "{{ auroraops_monitor_dir }}"
  changed_when: false
  tags: [rollback_verify, observability, auroraops_monitor]
- name: 验证宿主机保护资产完好无损
  become: true
  ansible.builtin.stat:
    path: "{{ item }}"
  register: auroraops_monitor_protected_stats
  loop: "{{ ['/data', '/data/home', '/data/config', '/data/workspace', '/data/state'] if auroraops_monitor_mode == 'outer_probe' else ['/var', '/var/lib', '/var/log', '/etc/systemd/system'] }}"
  tags: [rollback_verify, observability, auroraops_monitor]

- name: 断言受保护预置目录完整保留
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
    fail_msg: "回滚破坏了受保护预置目录: {{ item.item }}"
  loop: "{{ auroraops_monitor_protected_stats.results }}"
  tags: [rollback_verify, observability, auroraops_monitor]

- name: 检查无孤儿残留进程
  ansible.builtin.command:
    cmd: "pgrep -f 'auroraops_probe.py|spool_manager.py|auroraops_host_sampler.py|auroraops_aggregator.py'"
  register: auroraops_monitor_orphan_proc
  changed_when: false
  failed_when: auroraops_monitor_orphan_proc.rc == 0
  tags: [rollback_verify, observability, auroraops_monitor]

- name: 验证控制端 LaunchAgent 回滚终态 (Darwin Controller)
  ansible.builtin.include_tasks: controller_scheduler_rollback_verify.yml
  when: auroraops_monitor_mode != 'aggregator'
  tags: [rollback_verify, observability, auroraops_monitor]

- name: 验证 weekly report systemd unit 文件与配置已清理 (Aggregator)
  become: true
  ansible.builtin.stat:
    path: "{{ item }}"
  register: auroraops_monitor_aggregator_unit_stats
  loop:
    - /etc/systemd/system/auroraops_weekly_report.service
    - /etc/systemd/system/auroraops_weekly_report.timer
    - /etc/auroraops/auroraops_monitor.env
  when: auroraops_monitor_mode == 'aggregator'
  tags: [rollback_verify, observability, auroraops_monitor]

- name: 断言 weekly report systemd unit 文件完全不存在 (Aggregator)
  ansible.builtin.assert:
    that:
      - not item.stat.exists
    fail_msg: "回滚失败: {{ item.item }} 仍然残留"
  loop: "{{ auroraops_monitor_aggregator_unit_stats.results | default([]) }}"
  when: auroraops_monitor_mode == 'aggregator'
  tags: [rollback_verify, observability, auroraops_monitor]

- name: 验证 weekly report systemd timer 已完全停用 (Aggregator)
  ansible.builtin.command:
    cmd: systemctl is-active auroraops_weekly_report.timer
  register: auroraops_monitor_post_rb_weekly_timer_active
  changed_when: false
  failed_when: auroraops_monitor_post_rb_weekly_timer_active.rc == 0
  when: auroraops_monitor_mode == 'aggregator'
  tags: [rollback_verify, observability, auroraops_monitor]

- name: 验证 systemd unit 文件已清理 (Host Metrics)
  become: true
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  register: auroraops_monitor_unit_stats
  loop:
    - auroraops-monitor.service
    - auroraops-monitor.timer
  when: auroraops_monitor_mode == 'host_metrics'
  tags: [rollback_verify, observability, auroraops_monitor]

- name: 断言 systemd unit 文件完全不存在 (Host Metrics)
  ansible.builtin.assert:
    that:
      - not item.stat.exists
    fail_msg: "回滚失败: {{ item.item }} 仍然残留"
  loop: "{{ auroraops_monitor_unit_stats.results | default([]) }}"
  when: auroraops_monitor_mode == 'host_metrics'
  tags: [rollback_verify, observability, auroraops_monitor]

- name: 验证 systemd timer 已完全停用 (Host Metrics)
  ansible.builtin.command:
    cmd: systemctl is-active auroraops-monitor.timer
  register: auroraops_monitor_post_rb_timer_active
  changed_when: false
  failed_when: auroraops_monitor_post_rb_timer_active.rc == 0
  when: auroraops_monitor_mode == 'host_metrics'
  tags: [rollback_verify, observability, auroraops_monitor]

- name: 验证受限命令防护脚本已清理 (qqg1299)
  become: true
  ansible.builtin.stat:
    path: /usr/local/bin/auroraops_spool_puller_guard.py
  register: auroraops_monitor_guard_stat
  when: auroraops_monitor_mode == 'host_metrics'
  tags: [rollback_verify, observability, auroraops_monitor]

- name: 断言受限命令防护脚本不存在 (qqg1299)
  ansible.builtin.assert:
    that:
      - not auroraops_monitor_guard_stat.stat.exists
    fail_msg: "回滚残留: /usr/local/bin/auroraops_spool_puller_guard.py 未被清理"
  when: auroraops_monitor_mode == 'host_metrics'
  tags: [rollback_verify, observability, auroraops_monitor]

- name: 验证专用非特权用户已移除 (Host Metrics & Aggregator)
  ansible.builtin.command:
    cmd: "id -u {{ auroraops_monitor_user }}"
  register: auroraops_monitor_post_rb_user
  changed_when: false
  failed_when: auroraops_monitor_post_rb_user.rc == 0
  when: auroraops_monitor_mode in ['host_metrics', 'aggregator']
  tags: [rollback_verify, observability, auroraops_monitor]

- name: 回滚验证终态合规输出
  ansible.builtin.debug:
    msg: "Rollback Verify PASSED: Zero orphan processes, monitor dir absent, /data assets intact."
  tags: [rollback_verify, observability, auroraops_monitor]
