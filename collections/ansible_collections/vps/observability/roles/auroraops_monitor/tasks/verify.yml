---
# Stage 5: Verify (Active Assertions)
# Performs read-only programmatic assertions against live deployment.

- name: 验证 Baseline Fact 存在
  become: true
  ansible.builtin.stat:
    path: "{{ auroraops_monitor_fact_path }}"
  register: auroraops_monitor_verify_fact
  tags: [verify, observability, auroraops_monitor]

- name: 断言 Baseline Fact 文件存在
  ansible.builtin.assert:
    that:
      - auroraops_monitor_verify_fact.stat.exists
    fail_msg: "auroraops_monitor baseline fact 文件不存在"
  tags: [verify, observability, auroraops_monitor]

- name: 读取 Baseline Fact
  become: true
  ansible.builtin.slurp:
    path: "{{ auroraops_monitor_fact_path }}"
  register: auroraops_monitor_fact_raw
  tags: [verify, observability, auroraops_monitor]

- name: 断言 Baseline Fact 元数据合规
  ansible.builtin.assert:
    that:
      - (auroraops_monitor_fact_raw.content | b64decode | from_json).auroraops_managed | bool
      - (auroraops_monitor_fact_raw.content | b64decode | from_json).managed_dir == auroraops_monitor_dir
    fail_msg: "auroraops_monitor baseline fact 元数据不符合契约规范"
  tags: [verify, observability, auroraops_monitor]

- name: 验证工作目录与核心脚本存在
  become: true
  ansible.builtin.stat:
    path: "{{ item }}"
  register: auroraops_monitor_verify_stats
  loop: "{{ [auroraops_monitor_dir, auroraops_monitor_spool_dir, auroraops_monitor_dir ~ '/spool_manager.py', auroraops_monitor_dir ~ '/auroraops_probe.py', auroraops_monitor_dir ~ '/ipquality_geo_probe.py'] if auroraops_monitor_mode == 'outer_probe' else ([auroraops_monitor_dir, auroraops_monitor_dir ~ '/spool_manager.py', auroraops_monitor_dir ~ '/auroraops_aggregator.py', auroraops_monitor_dir ~ '/reports', auroraops_monitor_dir ~ '/cf_history'] if auroraops_monitor_mode == 'aggregator' else [auroraops_monitor_dir, auroraops_monitor_spool_dir, auroraops_monitor_dir ~ '/spool_manager.py', auroraops_monitor_dir ~ '/auroraops_host_sampler.py']) }}"
  tags: [verify, observability, auroraops_monitor]

- name: 断言目录与脚本均存在
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "关键监控资产不存在: {{ item.item }}"
  loop: "{{ auroraops_monitor_verify_stats.results }}"
  tags: [verify, observability, auroraops_monitor]

- name: 验证 Spool 总量 (Active + Sealed) 未超 50MB 阈值并执行 Schema 校验
  become: true
  become_user: "{{ auroraops_monitor_user }}"
  ansible.builtin.command:
    cmd: |
      python3 -c "
      import json, os, sys
      from pathlib import Path

      base = Path('{{ auroraops_monitor_dir }}')
      spool_dir = base / 'spool'
      active_file = base / '{{ auroraops_monitor_active_file }}'
      max_bytes = int('{{ auroraops_monitor_max_spool_bytes }}')
      mode = '{{ auroraops_monitor_mode }}'

      total_bytes = 0
      if active_file.exists():
          total_bytes += active_file.stat().st_size
      if spool_dir.exists():
          for f in spool_dir.iterdir():
              if f.is_file() and not f.is_symlink():
                  total_bytes += f.stat().st_size

      if total_bytes > max_bytes:
          print(f'Capacity exceeded: {total_bytes} > {max_bytes}')
          sys.exit(1)

      # Collect records from active and/or sealed files
      records = []
      if active_file.exists() and active_file.stat().st_size > 0:
          with open(active_file, 'r', encoding='utf-8') as f:
              for line in f:
                  if line.strip():
                      records.append(json.loads(line))
      if spool_dir.exists():
          for f in spool_dir.iterdir():
              if f.is_file() and not f.is_symlink() and f.name.endswith('.jsonl'):
                  with open(f, 'r', encoding='utf-8') as sf:
                      for line in sf:
                          if line.strip():
                              records.append(json.loads(line))

      if not records:
          print('No spool records found')
          sys.exit(2)

      for idx, r in enumerate(records):
          if mode == 'outer_probe':
              required = ['run_id', 'start_time_utc', 'overall_status', 'google', 'youtube', 'reachability']
              missing = [k for k in required if k not in r]
              if missing:
                  print(f'Record {idx} missing: {missing}')
                  sys.exit(3)
              if r['overall_status'] not in ('ok', 'degraded', 'failed'):
                  print(f'Record {idx} invalid overall_status: {r[\"overall_status\"]}')
                  sys.exit(4)
              gg = r.get('google', {})
              yt = r.get('youtube', {})
              if 'status' not in gg or 'sent_to_china' not in gg:
                  print(f'Record {idx} google block malformed')
                  sys.exit(5)
              if 'status' not in yt or 'sent_to_china' not in yt:
                  print(f'Record {idx} youtube block malformed')
                  sys.exit(6)
          else:
              # host_metrics validation
              required = ['timestamp_utc', 'host', 'collector', 'type', 'proc_metrics', 'geo_events']
              missing = [k for k in required if k not in r]
              if missing:
                  print(f'Record {idx} missing: {missing}')
                  sys.exit(3)
              if r['collector'] != 'auroraops_host_sampler':
                  print(f'Record {idx} invalid collector: {r[\"collector\"]}')
                  sys.exit(4)
              pm = r.get('proc_metrics', {})
              if not isinstance(pm, dict) or 'loadavg' not in pm or 'memory' not in pm or 'network' not in pm or 'sockets' not in pm:
                  print(f'Record {idx} proc_metrics malformed: {pm.keys() if isinstance(pm, dict) else pm}')
                  sys.exit(5)
              if not isinstance(r.get('geo_events'), list):
                  print(f'Record {idx} geo_events is not a list')
                  sys.exit(6)

      print(f'SUCCESS: total_bytes={total_bytes}, records_validated={len(records)}')
      "
  register: auroraops_monitor_schema_val
  changed_when: false
  failed_when: auroraops_monitor_schema_val.rc != 0
  tags: [verify, observability, auroraops_monitor]
  when: auroraops_monitor_mode != 'aggregator'

- name: 验证 Aggregator 周报生成、Schema 与脱敏 (Aggregator)
  become: true
  become_user: "{{ auroraops_monitor_user }}"
  ansible.builtin.command:
    cmd: |
      python3 -c "
      import json, sys
      from pathlib import Path
      sys.path.insert(0, '{{ auroraops_monitor_dir }}')
      from auroraops_aggregator import Aggregator

      rep_dir = Path('{{ auroraops_monitor_dir }}/reports')
      latest_json = rep_dir / 'weekly_report_latest.json'
      latest_md = rep_dir / 'weekly_report_latest.md'

      if not latest_json.exists():
          print('weekly_report_latest.json missing')
          sys.exit(1)
      if not latest_md.exists():
          print('weekly_report_latest.md missing')
          sys.exit(2)

      with open(latest_json, 'r', encoding='utf-8') as f:
          content_json = f.read()
          data = json.loads(content_json)

      with open(latest_md, 'r', encoding='utf-8') as f:
          content_md = f.read()

      # Assert zero secret leakage
      Aggregator.assert_sanitized(content_json)
      Aggregator.assert_sanitized(content_md)

      # Validate Schema
      for key in ['period', 'instabox', 'qqg1299', 'cf_monitor', 'jev_evaluation']:
          if key not in data:
              print(f'Missing required top-level key: {key}')
              sys.exit(3)
      # Assert actual consumption of #357 and #358 inputs
      ib_valid = data.get('instabox', {}).get('samples', {}).get('valid_runs', 0)
      if ib_valid <= 0:
          print(f'Instabox records not consumed: valid_runs={ib_valid}')
          sys.exit(5)

      qqg_valid = data.get('qqg1299', {}).get('samples', {}).get('valid_samples', 0)
      if qqg_valid <= 0:
          print(f'qqg1299 records not consumed: valid_samples={qqg_valid}')
          sys.exit(6)

      cf_srvs = data.get('cf_monitor', {}).get('servers_count', 0)
      if cf_srvs < 8:
          print(f'CF servers incomplete: count={cf_srvs}')
          sys.exit(7)

      jev = data['jev_evaluation']
      if jev.get('status') not in ('evaluated', 'pending_review'):
          print(f'Invalid Jev status: {jev.get(\"status\")}')
          sys.exit(4)

      print(f'SUCCESS: verified report (instabox={ib_valid}, qqg={qqg_valid}, cf={cf_srvs}, jev={jev.get(\"status\")})')
      "
  register: auroraops_monitor_report_val
  changed_when: false
  when: auroraops_monitor_mode == 'aggregator'
  tags: [verify, observability, auroraops_monitor]


- name: 验证控制端 LaunchAgent 状态 (Darwin Controller)
  ansible.builtin.include_tasks: controller_scheduler_verify.yml
  tags: [verify, observability, auroraops_monitor]

- name: 验证 systemd timer 处于活动状态 (Host Metrics)
  ansible.builtin.command:
    cmd: systemctl is-active auroraops-monitor.timer
  register: auroraops_monitor_timer_status
  changed_when: false
  failed_when: auroraops_monitor_timer_status.stdout.strip() != 'active'
  when: auroraops_monitor_mode == 'host_metrics'
  tags: [verify, observability, auroraops_monitor]

- name: 验证 weekly report systemd timer 处于活动状态 (Aggregator)
  ansible.builtin.command:
    cmd: systemctl is-active auroraops_weekly_report.timer
  register: auroraops_monitor_weekly_timer_status
  changed_when: false
  failed_when: auroraops_monitor_weekly_timer_status.stdout.strip() != 'active'
  when: auroraops_monitor_mode == 'aggregator'
  tags: [verify, observability, auroraops_monitor]

- name: 验证 cf collector systemd timer 处于活动状态 (Aggregator)
  ansible.builtin.command:
    cmd: systemctl is-active auroraops_cf_collector.timer
  register: auroraops_monitor_cf_timer_status
  changed_when: false
  failed_when: auroraops_monitor_cf_timer_status.stdout.strip() != 'active'
  when: auroraops_monitor_mode == 'aggregator'
  tags: [verify, observability, auroraops_monitor]

- name: 验证受限密钥执行未授权命令被拒绝 (qqg1299 安全边界核验)
  delegate_to: localhost
  ansible.builtin.shell: |
    ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ControlPath=none -o IdentitiesOnly=yes -i "{{ lookup('env', 'HOME') }}/.auroraops/keys/qqg1299_monitor_puller_ed25519" "{{ auroraops_monitor_user }}@qqg1299" uname -a 2>&1 || true
  register: auroraops_monitor_guard_denial
  changed_when: false
  failed_when: "'Access denied' not in auroraops_monitor_guard_denial.stdout"
  when: auroraops_monitor_mode == 'host_metrics'
  tags: [verify, observability, auroraops_monitor]

- name: 验证受限密钥执行 Spool 查询被安全放行 (qqg1299)
  delegate_to: localhost
  ansible.builtin.shell: |
    ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ControlPath=none -o IdentitiesOnly=yes -i "{{ lookup('env', 'HOME') }}/.auroraops/keys/qqg1299_monitor_puller_ed25519" "{{ auroraops_monitor_user }}@qqg1299" python3 /var/lib/auroraops-monitor/spool_manager.py list
  register: auroraops_monitor_guard_allow
  changed_when: false
  failed_when: auroraops_monitor_guard_allow.rc != 0
  when: auroraops_monitor_mode == 'host_metrics'
  tags: [verify, observability, auroraops_monitor]
- name: 验证结果摘要
  ansible.builtin.debug:
    msg: "Verify SUCCESS: Fact present, {{ auroraops_monitor_schema_val.stdout if auroraops_monitor_mode != 'aggregator' else auroraops_monitor_report_val.stdout }}"
  tags: [verify, observability, auroraops_monitor]
