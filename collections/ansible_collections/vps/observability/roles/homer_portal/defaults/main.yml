---
homer_portal_enabled: true
homer_portal_version: "v26.08.3"
homer_portal_project_name: "homer-portal"
homer_portal_title: "Suai Operations Hub"
homer_portal_subtitle: "Cloudflare Workers & Infrastructure Portal"
homer_portal_logo: "logo.png"
homer_portal_columns: "3"
homer_portal_connectivity_check: true
homer_portal_staging_dir: "/tmp/homer-portal-staging"
homer_portal_release_url: "https://github.com/bastienwirtz/homer/releases/download/{{ homer_portal_version }}/homer.zip"

homer_portal_links:
  - name: "探针大盘"
    icon: "fas fa-server"
    url: "https://mt.suainam.eu.org"
    target: "_blank"
  - name: "Cloudflare"
    icon: "fab fa-cloudflare"
    url: "https://dash.cloudflare.com"
    target: "_blank"
  - name: "GitHub"
    icon: "fab fa-github"
    url: "https://github.com/su-kaka"
    target: "_blank"

homer_portal_services:
  - name: "Cloudflare 边缘应用与 Workers"
    icon: "fab fa-cloudflare"
    items:
      - name: "CF-Server-Monitor"
        icon: "fas fa-chart-line"
        subtitle: "D1 + DO 驱动的多节点实时性能大盘"
        tag: "Worker+DO"
        tagstyle: "is-info"
        url: "https://mt.suainam.eu.org"
        target: "_blank"
      - name: "Cloud-ST Tracer"
        icon: "fas fa-tachometer-alt"
        subtitle: "Cloudflare 优选测速与全球节点回源追踪"
        tag: "Worker"
        tagstyle: "is-primary"
        url: "https://cloud-st-tracer.suainam.workers.dev"
        target: "_blank"
      - name: "Open-Connector"
        icon: "fas fa-database"
        subtitle: "D1 存储驱动的数据中继与连接中心"
        tag: "Worker+D1"
        tagstyle: "is-link"
        url: "https://open-connector.suainam.workers.dev"
        target: "_blank"
      - name: "Opcotoai Mail Worker"
        icon: "fas fa-envelope-open-text"
        subtitle: "Cloudflare 域名邮件接收与转发网关"
        tag: "Worker"
        tagstyle: "is-warning"
        url: "https://your-mail-worker.suainam.workers.dev"
        target: "_blank"

  - name: "AI 代理与大模型 API"
    icon: "fas fa-brain"
    items:
      - name: "New API"
        icon: "fas fa-network-wired"
        subtitle: "多模型聚合路由与分发控制台"
        tag: "Router"
        tagstyle: "is-primary"
        url: "https://api.msuai.top"
        target: "_blank"
      - name: "GCLI2API"
        icon: "fas fa-robot"
        subtitle: "Gemini CLI API 代理服务网关"
        tag: "Gemini"
        tagstyle: "is-warning"
        url: "https://api-gcli.msuai.top"
        target: "_blank"
      - name: "CLI Proxy API"
        icon: "fas fa-terminal"
        subtitle: "AI CLI 工具上游接口代理"
        tag: "Proxy"
        tagstyle: "is-link"
        url: "https://clip.suai.eu.org"
        target: "_blank"
      - name: "DS2API"
        icon: "fas fa-cube"
        subtitle: "DeepSeek / Claude / OpenAI API 转换协议"
        tag: "DeepSeek"
        tagstyle: "is-info"
        url: "https://ds2api.suai.eu.org"
        target: "_blank"
      - name: "Vertex AI Proxy"
        icon: "fas fa-microchip"
        subtitle: "Google Cloud Vertex AI 负载代理"
        tag: "Vertex"
        tagstyle: "is-danger"
        url: "https://vertex.msuai.top"
        target: "_blank"
      - name: "opctoai Toolkit"
        icon: "fas fa-tools"
        subtitle: "自动化工具箱与 SMTP 邮件通道"
        tag: "Toolkit"
        tagstyle: "is-dark"
        url: "https://opctoai.suai.eu.org"
        target: "_blank"
      - name: "OpenCode Server"
        icon: "fas fa-laptop-code"
        subtitle: "云端 IDE 与远程开发工作区"
        tag: "Dev"
        tagstyle: "is-link"
        url: "https://opencode.msuai.top"
        target: "_blank"

  - name: "生产力与运维工具"
    icon: "fas fa-shield-alt"
    items:
      - name: "Vaultwarden"
        icon: "fas fa-key"
        subtitle: "安全密码库 (Bitwarden 兼容协议)"
        tag: "Security"
        tagstyle: "is-primary"
        url: "https://bws.suai.eu.org"
        target: "_blank"
      - name: "SillyTavern"
        icon: "fas fa-comments"
        subtitle: "LLM 交互与上下文推理前端"
        tag: "WebUI"
        tagstyle: "is-warning"
        url: "https://slt.msuai.top"
        target: "_blank"
      - name: "Pi Terminal (OMP)"
        icon: "fas fa-code"
        subtitle: "Oh My Pi Web 终端调度环境"
        tag: "Terminal"
        tagstyle: "is-dark"
        url: "https://pi.suai.eu.org"
        target: "_blank"
      - name: "Sub-Store"
        icon: "fas fa-layer-group"
        subtitle: "节点订阅管理与规则转换平台"
        tag: "Sub"
        tagstyle: "is-info"
        url: "https://sub.suai.eu.org"
        target: "_blank"
      - name: "Singbox Optimizer"
        icon: "fas fa-route"
        subtitle: "节点分流规则与动态订阅分发"
        tag: "Routing"
        tagstyle: "is-light"
        url: "https://assets.suai.eu.org"
        target: "_blank"
      - name: "AuroraOps Uptime"
        icon: "fas fa-heartbeat"
        subtitle: "节点健康检查与自愈监控心跳"
        tag: "Health"
        tagstyle: "is-success"
        url: "https://moe.saui.dpdns.org"
        target: "_blank"
