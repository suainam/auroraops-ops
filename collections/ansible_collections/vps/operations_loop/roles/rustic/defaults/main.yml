---
# Rustic Role - 默认变量
# 变量从 group_vars/all/backup.yml 继承

rustic_install_method: "apt"
rustic_version: "latest"

rustic_backup_timeout: 900
rustic_local_service_timeout: 1800
rustic_cloud_service_timeout: 7200
rustic_lock_file: "/run/lock/rustic-backup.lock"
rustic_forget_timeout_seconds: 900
rustic_lock_timeout: 180
rustic_log_dir: "/var/log/rustic"
rustic_temp_dir: "/var/lib/rustic/.init_markers"
rustic_cleanup_success_marker: "/var/lib/rustic/cleanup-success.json"
rustic_rclone_config_path: "{{ (ansible_env.HOME ~ '/.config/rclone/rclone.conf') if ((ansible_system | default('Linux')) == 'Darwin') else '/root/.config/rclone/rclone.conf' }}"

# Optional role-local Logrotate configuration
rustic_logrotate_enabled: true
rustic_logrotate_config_path: "/etc/logrotate.d/rustic"
rustic_logrotate_config:
  log_path: "/var/log/rustic/*.log"
  interval: daily
  rotate_count: 7
  compress: true
  delaycompress: true
  missingok: true
  notifempty: true

rustic_vault_rustic_password: "{{ vault_rustic_password | default('') }}"

rustic_backup_base_dir: "{{ backup_base_dir | default('/opt/backups') }}"
rustic_backup_source_docker_dir: "{{ backup_source_docker_dir | default('/opt/dockers') }}"
rustic_backup_cloud_remotes: "{{ backup_cloud_remotes | default(['onedrive', 'gdrive']) }}"
rustic_backup_cloud_prefix: "{{ backup_cloud_prefix | default('backup') }}"
rustic_backup_exclude_file: "/etc/rustic/exclude.txt"
rustic_cloud_backup_enabled: true

rustic_backup_src_paths: "{{ backup_src_paths | default([]) }}"
rustic_backup_src_paths_extra: "{{ backup_src_paths_extra | default([]) }}"

rustic_backup_retention_10min: "{{ backup_retention_10min | default(3) }}"
rustic_backup_retention_daily: "{{ backup_retention_daily | default(1) }}"
rustic_backup_retention_weekly: "{{ backup_retention_weekly | default(1) }}"
rustic_backup_retention_monthly: "{{ backup_retention_monthly | default(1) }}"
rustic_backup_retention_yearly: "{{ backup_retention_yearly | default(1) }}"

rustic_postgresql_db_admin_password: "{{ postgresql_db_admin_password | default('') }}"
rustic_redis_db_admin_password: "{{ redis_db_admin_password | default('') }}"

rustic_health_check_enabled: true
rustic_manage_units: true
rustic_check_interval: "weekly"

# 定时器配置
# 旧 combined timer 仅供 rollback 兼容。
rustic_backup_timer_calendar: "*-*-* *:0/20"
rustic_local_backup_timer_calendar: "hourly"
rustic_cloud_backup_timer_calendar: "*-*-* 00/6:17"
rustic_check_timer_calendar: "Sun *-*-* 04:30"
# 清理：每小时1次（45分），与云端备份（00/6:17 + 15m 随机延迟窗口）彻底错开
rustic_cleanup_timer_calendar: "*-*-* *:45"

# Restore 恢复配置
rustic_restore_mode: false
rustic_restore_source: "onedrive"
rustic_restore_target_dir: "/tmp/rustic_restore"
rustic_restore_snapshot: ""
rustic_restore_latest: true
rustic_restore_databases: false
rustic_restore_include: ""
rustic_restore_exclude: ""

# Restore 功能开关
rustic_restore_docker_apps: false
rustic_restore_docker_app: "" # 单应用恢复 (例: sillytavern)
rustic_restore_system: false
rustic_recovery_probe_mode: false
rustic_observe_baseline_mode: false

# Restore 操作类型
rustic_restore_action: "" # list_snapshots, restore

# Darwin-specific paths and configuration
rustic_darwin_support_dir: "{{ ansible_env.HOME }}/Library/Application Support/AuroraOps/rustic"
rustic_darwin_launchagents_dir: "{{ ansible_env.HOME }}/Library/LaunchAgents"
rustic_darwin_script_path: "{{ rustic_darwin_support_dir }}/config/rustic_backup.py"
rustic_darwin_local_repo: "{{ rustic_darwin_support_dir }}/repo"
rustic_darwin_config_dir: "{{ rustic_darwin_support_dir }}/config"
rustic_darwin_log_dir: "{{ rustic_darwin_support_dir }}/logs"
rustic_darwin_run_dir: "{{ rustic_darwin_support_dir }}/run"
rustic_darwin_tmp_dir: "{{ rustic_darwin_support_dir }}/tmp"
rustic_bin_path: "rustic"
rustic_darwin_bin_path: "{{ '/opt/homebrew/bin/rustic' if (ansible_architecture | default('arm64')) == 'arm64' else '/usr/local/bin/rustic' }}"
rustic_darwin_rclone_bin_path: "{{ '/opt/homebrew/bin/rclone' if (ansible_architecture | default('arm64')) == 'arm64' else '/usr/local/bin/rclone' }}"
rustic_darwin_rclone_config_path: "{{ ansible_env.HOME }}/.config/rclone/rclone.conf"
rustic_darwin_launchd_local_label: "com.auroraops.rustic-local"
rustic_darwin_launchd_cloud_label: "com.auroraops.rustic-cloud"
rustic_darwin_launchd_cleanup_label: "com.auroraops.rustic-cleanup"
rustic_darwin_cleanup_timer_minute: 45
rustic_local_backup_timer_minute: "*/20"
rustic_cloud_backup_timer_minute: "17"
rustic_darwin_local_backup_minutes:
  - 0
  - 20
  - 40
rustic_darwin_rollback_remove_support: false
