---
# Homebrew and zerobrew both installing rustic/rclone produced a
# duplicate-formula-owner failure, so zerobrew owns the Darwin binaries.
- name: List Zerobrew-installed formulas
  ansible.builtin.command:
    cmd: "{{ rustic_darwin_zb_bin }} list"
  register: rustic_darwin_zb_list
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [deploy, operations_loop, rustic, rustic_install, phase7]

# `zb install` always reports "Installed" even when the packages are already
# present, so gate the install on `zb list` to keep the role idempotent.
- name: Install Rustic and rclone via Zerobrew
  ansible.builtin.command:
    cmd: "{{ rustic_darwin_zb_bin }} install rustic rclone"
  register: rustic_darwin_zb_install
  when: >-
    rustic_darwin_zb_list.rc != 0
    or rustic_darwin_zb_missing | length > 0
  vars:
    rustic_darwin_zb_installed: >-
      {{ rustic_darwin_zb_list.stdout_lines
         | map('regex_replace', '^(\S+).*$', '\1') | list }}
    rustic_darwin_zb_missing: >-
      {{ ['rustic', 'rclone'] | difference(rustic_darwin_zb_installed) }}
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [deploy, operations_loop, rustic, rustic_install, phase7]

- name: Resolve Darwin Rustic binary paths
  ansible.builtin.import_tasks: resolve_darwin_binaries.yml
  tags: [deploy, operations_loop, rustic, rustic_install, phase7]

- name: Create Application Support directories for Rustic
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ rustic_darwin_support_dir }}/config"
    - "{{ rustic_darwin_support_dir }}/logs"
    - "{{ rustic_darwin_support_dir }}/run"
    - "{{ rustic_darwin_local_repo }}"
    - "{{ rustic_darwin_tmp_dir }}"
    - "{{ rustic_darwin_launchagents_dir }}"
  tags: [deploy, operations_loop, rustic, rustic_init, phase7]

- name: Deploy Rustic backup script to Application Support
  ansible.builtin.copy:
    src: rustic_backup.py
    dest: "{{ rustic_darwin_script_path }}"
    mode: "0755"
  tags: [deploy, operations_loop, rustic, rustic_deploy, phase7]

- name: Deploy Rustic configuration (rustic.toml)
  ansible.builtin.template:
    src: rustic.toml.j2
    dest: "{{ rustic_darwin_config_dir }}/rustic.toml"
    mode: "0600"
  tags: [deploy, operations_loop, rustic, rustic_deploy, phase7]

- name: Deploy Rustic exclude file
  ansible.builtin.copy:
    content: |
      {% for pattern in backup_exclude_paths | default([]) %}
      {% if pattern.startswith('**/') and pattern.endswith('/**') %}
      !{{ pattern[:-2] }}
      {% elif pattern.startswith('**/') %}
      !{{ pattern[3:] }}
      {% else %}
      !{{ pattern }}
      {% endif %}
      {% endfor %}
    dest: "{{ rustic_darwin_config_dir }}/exclude.txt"
    mode: "0644"
  tags: [deploy, operations_loop, rustic, rustic_deploy, phase7]

- name: Deploy Rustic password file (Darwin, private 0600)
  ansible.builtin.copy:
    content: "{{ vault_rustic_password }}"
    dest: "{{ rustic_darwin_config_dir }}/password.txt"
    mode: "0600"
  no_log: true
  tags: [deploy, operations_loop, rustic, rustic_deploy, phase7]

- name: Deploy private backup.env with secrets (0600, no_log)
  ansible.builtin.template:
    src: backup.env.j2
    dest: "{{ rustic_darwin_config_dir }}/backup.env"
    mode: "0600"
  no_log: true
  tags: [deploy, operations_loop, rustic, rustic_deploy, phase7]

- name: Deploy LaunchAgent plist for local backup
  ansible.builtin.template:
    src: rustic-local.plist.j2
    dest: "{{ rustic_darwin_launchagents_dir }}/{{ rustic_darwin_launchd_local_label }}.plist"
    mode: "0644"
  register: rustic_darwin_local_plist
  tags: [deploy, operations_loop, rustic, rustic_deploy, phase7]

- name: Deploy LaunchAgent plist for cloud backup
  ansible.builtin.template:
    src: rustic-cloud.plist.j2
    dest: "{{ rustic_darwin_launchagents_dir }}/{{ rustic_darwin_launchd_cloud_label }}.plist"
    mode: "0644"
  register: rustic_darwin_cloud_plist
  tags: [deploy, operations_loop, rustic, rustic_deploy, phase7]

- name: Deploy LaunchAgent plist for cleanup
  ansible.builtin.template:
    src: rustic-cleanup.plist.j2
    dest: "{{ rustic_darwin_launchagents_dir }}/{{ rustic_darwin_launchd_cleanup_label }}.plist"
    mode: "0644"
  register: rustic_darwin_cleanup_plist
  tags: [deploy, operations_loop, rustic, rustic_deploy, phase7]

- name: Deploy LaunchAgent plist for daily freshness audit
  ansible.builtin.template:
    src: rustic-audit.plist.j2
    dest: "{{ rustic_darwin_launchagents_dir }}/{{ rustic_darwin_launchd_audit_label }}.plist"
    mode: "0644"
  register: rustic_darwin_audit_plist
  tags: [deploy, operations_loop, rustic, rustic_deploy, phase7]

- name: Manage daily freshness audit LaunchAgent
  community.general.launchd:
    name: "{{ rustic_darwin_launchd_audit_label }}"
    state: restarted
  when:
    - not ansible_check_mode
    - rustic_darwin_audit_plist.changed
  tags: [deploy, operations_loop, rustic, rustic_deploy, phase7]

- name: Ensure daily freshness audit LaunchAgent is loaded
  community.general.launchd:
    name: "{{ rustic_darwin_launchd_audit_label }}"
    state: started
  when: not ansible_check_mode
  tags: [deploy, operations_loop, rustic, rustic_deploy, phase7]

- name: Manage local backup LaunchAgent
  community.general.launchd:
    name: "{{ rustic_darwin_launchd_local_label }}"
    state: restarted
  when:
    - not ansible_check_mode
    - rustic_darwin_local_plist.changed
  tags: [deploy, operations_loop, rustic, rustic_deploy, phase7]

- name: Manage cloud backup LaunchAgent
  community.general.launchd:
    name: "{{ rustic_darwin_launchd_cloud_label }}"
    state: restarted
  when:
    - not ansible_check_mode
    - rustic_darwin_cloud_plist.changed
  tags: [deploy, operations_loop, rustic, rustic_deploy, phase7]

- name: Manage cleanup LaunchAgent
  community.general.launchd:
    name: "{{ rustic_darwin_launchd_cleanup_label }}"
    state: restarted
  when:
    - not ansible_check_mode
    - rustic_darwin_cleanup_plist.changed
  tags: [deploy, operations_loop, rustic, rustic_deploy, phase7]

- name: Ensure local backup LaunchAgent is loaded
  community.general.launchd:
    name: "{{ rustic_darwin_launchd_local_label }}"
    state: started
  when: not ansible_check_mode
  tags: [deploy, operations_loop, rustic, rustic_deploy, phase7]

- name: Ensure cloud backup LaunchAgent is loaded
  community.general.launchd:
    name: "{{ rustic_darwin_launchd_cloud_label }}"
    state: started
  when: not ansible_check_mode
  tags: [deploy, operations_loop, rustic, rustic_deploy, phase7]

- name: Ensure cleanup LaunchAgent is loaded
  community.general.launchd:
    name: "{{ rustic_darwin_launchd_cleanup_label }}"
    state: started
  when: not ansible_check_mode
  tags: [deploy, operations_loop, rustic, rustic_deploy, phase7]
