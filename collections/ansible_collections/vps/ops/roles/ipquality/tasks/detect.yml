---
# Stage 1 (detection): run the official xykt/ipquality scoring script per exit.
#
# No persistent artifact is left on the target: the script is fetched to a
# world-readable temp directory and the role's helpers are executed through the
# `script` module, which cleans up after itself.

- name: 创建本次审计的临时工作目录
  ansible.builtin.tempfile:
    state: directory
    suffix: ipquality
  register: ipquality_tempdir
  when: not (ipquality_offline | bool)
  changed_when: false

# A deterministic `ipquality_workdir`, not `ipquality_tempdir.path`.
# `--check` does not execute the tempfile task, so any later reference to that
# registered result is an undefined-variable error that aborts the dry-run
# preview. The boolean form of `default` also covers the offline case, where the
# tempfile task is skipped entirely.
- name: 设定本次审计的临时工作目录
  ansible.builtin.set_fact:
    ipquality_workdir: "{{ ipquality_tempdir.path | default(ipquality_report_dir ~ '/.work', true) }}"
  when: not (ipquality_offline | bool)
  changed_when: false

# The deterministic fallback is a real path, so it must exist before get_url
# writes into it. Created unconditionally under the report directory, and
# removed again at the end of this file, so nothing resident is left behind.
- name: 确保临时工作目录存在
  ansible.builtin.file:
    path: "{{ ipquality_workdir | default('', true) }}"
    state: directory
    mode: "0700"
  when:
    - ipquality_enabled | bool
    - not (ipquality_offline | bool)
    - ipquality_workdir | default('', true) | length > 0
  changed_when: false

- name: 拉取官方 ipquality 脚本 (只读上游评分逻辑)
  ansible.builtin.get_url:
    url: "{{ ipquality_upstream_script_url }}"
    dest: "{{ ipquality_workdir }}/ipquality.sh"
    mode: "0700"
    timeout: 60
  when: not (ipquality_offline | bool)
  changed_when: false

- name: 校验官方脚本指纹 (防上游被替换)
  ansible.builtin.stat:
    path: "{{ ipquality_workdir }}/ipquality.sh"
    checksum_algorithm: sha256
  register: ipquality_script_stat
  when:
    - not (ipquality_offline | bool)
    - ipquality_upstream_script_sha256 | length > 0
  changed_when: false

- name: 官方脚本指纹不符时中止
  ansible.builtin.assert:
    that:
      - ipquality_script_stat.stat.checksum == ipquality_upstream_script_sha256
    fail_msg: >-
      ipquality.sh 指纹不匹配 (期望 {{ ipquality_upstream_script_sha256 }},
      实际 {{ ipquality_script_stat.stat.checksum }})。上游已被替换或传输被篡改。
    quiet: true
  when:
    - not (ipquality_offline | bool)
    - ipquality_upstream_script_sha256 | length > 0

# `role_path` is a path on the Ansible controller, not on the target, so a
# remote task cannot execute a helper from it. The helpers are therefore staged
# into the report directory with `copy` (which does transfer over SSH) and
# removed again at the end of this file, so nothing resident is left behind.
- name: 将检测助手暂存到目标机
  ansible.builtin.copy:
    src: ipquality_run_exit.py
    dest: "{{ ipquality_workdir }}/ipquality_run_exit.py"
    mode: "0700"
  when:
    - ipquality_enabled | bool
    - not (ipquality_offline | bool)
    - ipquality_workdir | default('', true) | length > 0
  changed_when: false

- name: 为每个出口执行官方检测
  ansible.builtin.command:
    # Invoked through the interpreter so the mode bit never matters. The
    # observation goes to a file rather than stdout because the upstream report
    # is large and full of escape sequences.
    argv:
      - "{{ ipquality_python_interpreter }}"
      - "{{ ipquality_workdir }}/ipquality_run_exit.py"
      - "{{ item.name | default('exit') | regex_replace('[^A-Za-z0-9_.-]', '_') }}"
      - "{{ ipquality_report_dir }}/observations/{{ item.name | default('exit') | regex_replace('[^A-Za-z0-9_.-]', '_') }}.json"
  environment:
    IPQUALITY_SOCKS5_SERVER: "{{ item.socks5.server | default('') }}"
    IPQUALITY_SOCKS5_PORT: "{{ item.socks5.port | default('') }}"
    IPQUALITY_SOCKS5_USER: "{{ item.socks5.username | default('') }}"
    IPQUALITY_SOCKS5_PASS: "{{ item.socks5.password | default('') }}"
    # `ipquality_workdir` is now a plain string, so no attribute access is
    # involved. The boolean `default` covers the offline and `--check` cases.
    IPQUALITY_SCRIPT: "{{ (ipquality_workdir | default('', true)) ~ '/ipquality.sh' }}"
    # Parenthesised so `join` applies to the whole list; without the
    # parentheses Jinja binds the filter to the final term only and the
    # concatenation fails with "can only concatenate list (not str)".
    IPQUALITY_SCRIPT_ARGS: >-
      {{ (['-j']
          + (['-p'] if ipquality_privacy_mode | bool else [])
          + (['-n'] if not ipquality_offline | bool else [])
          + (['-4'] if ipquality_ipv4_only | bool else [])
          + (['-E'] if ipquality_language == 'en' else ['-l', ipquality_language]))
         | join(' ') }}
    IPQUALITY_OFFLINE_PAYLOAD: "{{ ipquality_offline_payload | default('') }}"
    # An ambient proxy would silently hijack the exit-IP lookup and misreport
    # this host's own address as the measured exit.
    http_proxy: ""
    https_proxy: ""
    all_proxy: ""
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
    ALL_PROXY: ""
  register: ipquality_raw_runs
  changed_when: false
  failed_when: false
  loop: "{{ ipquality_exits }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"
  no_log: true
  when: ipquality_enabled | bool

- name: 校验每个出口的观测文件均已生成
  ansible.builtin.stat:
    path: "{{ ipquality_report_dir }}/observations/{{ item.name | default('exit') | regex_replace('[^A-Za-z0-9_.-]', '_') }}.json"
  register: ipquality_observation_files
  changed_when: false
  loop: "{{ ipquality_exits }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"
  when: ipquality_enabled | bool

- name: 观测文件缺失时中止 (否则报告会静默为空)
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: >-
      出口 {{ item.item.name | default('exit') }} 未生成观测文件，检测阶段未完成。
    quiet: true
  loop: "{{ ipquality_observation_files.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('exit') }}"
  when: ipquality_enabled | bool

# Zero-pollution: the fetched upstream script and its temp directory are removed
# once the observations exist, so a read-only audit leaves nothing resident on the
# target. The report and observations under ipquality_report_dir are the only
# durable output.
- name: 清理本次审计的临时工作目录
  ansible.builtin.file:
    path: "{{ ipquality_workdir | default('', true) }}"
    state: absent
  when:
    - ipquality_enabled | bool
    - not (ipquality_offline | bool)
    - ipquality_workdir | default('', true) | length > 0
  changed_when: false
