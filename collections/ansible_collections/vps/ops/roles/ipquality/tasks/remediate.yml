---
# Stage 3 (remediation): run the three stages together, emit the report, and
# assert. The decision logic lives in ipquality_pipeline.py so it is testable
# without Ansible, a network, or credentials.

- name: 构造三段式闭环的判定请求
  ansible.builtin.set_fact:
    ipquality_request:
      # The stage-1 observations are read from disk by the pipeline, so the
      # large upstream report never travels through Ansible's stdout.
      observations_dir: "{{ ipquality_report_dir }}/observations"
      geo_probes: "{{ ipquality_geo_probes | default({}) }}"
      max_fraud_score: "{{ ipquality_max_fraud_score | float }}"
      require_residential: "{{ ipquality_require_residential | bool }}"
      reroute_targets: "{{ ipquality_remediation_reroute_targets | default([]) }}"
      sentinel_enabled: "{{ ipquality_sentinel_enabled | bool }}"
      residential_available: "{{ ipquality_residential_alternatives_available | bool }}"
  when: ipquality_enabled | bool
  no_log: true

- name: 执行检测 + 送中判定 + 治理建议
  ansible.builtin.command:
    argv:
      - "{{ ipquality_python_interpreter }}"
      - "{{ role_path }}/files/ipquality_pipeline.py"
    stdin: "{{ ipquality_request | to_nice_json }}"
  register: ipquality_verdict
  changed_when: false
  when: ipquality_enabled | bool
  no_log: true

- name: 落地结构化 JSON 报告
  ansible.builtin.copy:
    content: "{{ ipquality_verdict.stdout | from_json | to_nice_json }}\n"
    dest: "{{ ipquality_report_dir }}/report.json"
    mode: "0600"
  when:
    - ipquality_enabled | bool
    - ipquality_report_json | bool
  no_log: true

- name: 落地 Markdown 摘要
  ansible.builtin.copy:
    content: "{{ ipquality_verdict.stdout | from_json | to_nice_json }}\n"
    dest: "{{ ipquality_report_dir }}/report.json.md"
    mode: "0600"
  when:
    - ipquality_enabled | bool
    - ipquality_report_markdown | bool
  no_log: true

- name: 输出每个出口的判定与治理建议
  ansible.builtin.debug:
    msg: >-
      exit={{ item.exit_name }}
      residential={{ item.detection.is_residential | default('unknown') }}
      max_fraud_score={{ item.detection.max_fraud_score | default('n/a') }}
      geo={{ item.drift.verdict | default('unknown') }}
      strategy={{ item.remediation.remediation_strategy | default('none_required') }}
      passed={{ item.passed }}
  loop: "{{ (ipquality_verdict.stdout | from_json).results | default([]) }}"
  loop_control:
    label: "{{ item.exit_name }}"
  when: ipquality_enabled | bool

- name: 断言阈值 (fail-loud)
  ansible.builtin.assert:
    that:
      - (ipquality_verdict.stdout | from_json).results | map(attribute='passed') | select('equalto', false) | list | length == 0
    fail_msg: >-
      IP 质量门禁未通过:
      {{ (ipquality_verdict.stdout | from_json).results
         | rejectattr('passed') | map(attribute='exit_name') | list }}
      违规详情见 {{ ipquality_report_dir }}/report.json
    success_msg: >-
      IP 质量门禁通过: {{ (ipquality_verdict.stdout | from_json).summary.passed }}
      个出口全部达标
    quiet: true
  when:
    - ipquality_enabled | bool
    - ipquality_fail_on_violation | bool
  no_log: true
