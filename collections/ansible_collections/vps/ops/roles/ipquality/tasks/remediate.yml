---
# Stage 3 (remediation): run the three stages together, emit the report, and
# assert. The decision logic lives in ipquality_pipeline.py so it is testable
# without Ansible, a network, or credentials.

- name: 构造三段式闭环的判定请求
  ansible.builtin.set_fact:
    ipquality_request:
      # The stage-1 observations are read from disk by the pipeline, so the
      # large upstream report never travels through Ansible's stdout.
      observations_dir: "{{ ipquality_report_dir }}/observations"
      geo_probes: "{{ ipquality_geo_probes | default({}) }}"
      max_fraud_score: "{{ ipquality_max_fraud_score | float }}"
      require_residential: "{{ ipquality_require_residential | bool }}"
      reroute_targets: "{{ ipquality_remediation_reroute_targets | default([]) }}"
      sentinel_enabled: "{{ ipquality_sentinel_enabled | bool }}"
      residential_available: "{{ ipquality_residential_alternatives_available | bool }}"
  when: ipquality_enabled | bool
  no_log: true

# `role_path` is controller-side; the pipeline and the analyzer it imports must
# both be staged onto the target, or the import fails at runtime.
# The staged names deliberately keep the original module basenames: the pipeline
# does `from ipquality_analyzer import ...`, so renaming either file breaks it.
- name: 将判定引擎暂存到目标机
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ ipquality_report_dir }}/{{ item }}"
    mode: "0700"
  loop:
    - ipquality_pipeline.py
    - ipquality_analyzer.py
  when: ipquality_enabled | bool
  changed_when: false

- name: 执行检测 + 送中判定 + 治理建议
  ansible.builtin.command:
    # PYTHONPATH points at the report directory so the pipeline can import the
    # staged analyzer module.
    argv:
      - "{{ ipquality_python_interpreter }}"
      - "{{ ipquality_report_dir }}/ipquality_pipeline.py"
    stdin: "{{ ipquality_request | to_nice_json }}"
  environment:
    PYTHONPATH: "{{ ipquality_report_dir }}"
    # Importing the staged analyzer would otherwise write a __pycache__ beside it
    # on the target, which is residue a read-only audit must not leave behind.
    PYTHONDONTWRITEBYTECODE: "1"
    # Importing the staged analyzer would otherwise leave a __pycache__ beside
    # it, which is residue a read-only audit must not leave on the target.
    PYTHONDONTWRITEBYTECODE: "1"
  register: ipquality_verdict
  changed_when: false
  when: ipquality_enabled | bool
  no_log: true

- name: 落地结构化 JSON 报告
  ansible.builtin.copy:
    content: "{{ ipquality_verdict.stdout | from_json | to_nice_json }}\n"
    dest: "{{ ipquality_report_dir }}/report.json"
    mode: "0600"
  when:
    - ipquality_enabled | bool
    - ipquality_report_json | bool
  no_log: true

- name: 落地 Markdown 摘要
  ansible.builtin.copy:
    content: "{{ ipquality_verdict.stdout | from_json | to_nice_json }}\n"
    dest: "{{ ipquality_report_dir }}/report.json.md"
    mode: "0600"
  when:
    - ipquality_enabled | bool
    - ipquality_report_markdown | bool
  no_log: true

- name: 输出每个出口的判定与治理建议
  ansible.builtin.debug:
    msg: >-
      exit={{ item.exit_name }}
      residential={{ item.detection.is_residential | default('unknown') }}
      max_fraud_score={{ item.detection.max_fraud_score | default('n/a') }}
      geo={{ item.drift.verdict | default('unknown') }}
      strategy={{ item.remediation.remediation_strategy | default('none_required') }}
      passed={{ item.passed }}
  loop: "{{ (ipquality_verdict.stdout | from_json).results | default([]) }}"
  loop_control:
    label: "{{ item.exit_name }}"
  when: ipquality_enabled | bool

# Zero-pollution: the staged helpers are removed once the verdict exists, so the
# only durable output is report.json, report.json.md and observations/.
# The bytecode cache is removed too: importing the staged analyzer would
# otherwise leave a __pycache__ directory beside it on the target.
- name: 清理暂存的判定引擎 (报告与观测数据保留)
  ansible.builtin.file:
    path: "{{ ipquality_report_dir }}/{{ item }}"
    state: absent
  loop:
    - ipquality_pipeline.py
    - ipquality_analyzer.py
    - ipquality_geo_probe.py
    - __pycache__
  when: ipquality_enabled | bool
  changed_when: false

- name: 断言阈值 (fail-loud)
  ansible.builtin.assert:
    that:
      - (ipquality_verdict.stdout | from_json).results | map(attribute='passed') | select('equalto', false) | list | length == 0
    fail_msg: >-
      IP 质量门禁未通过:
      {{ (ipquality_verdict.stdout | from_json).results
         | rejectattr('passed') | map(attribute='exit_name') | list }}
      违规详情见 {{ ipquality_report_dir }}/report.json
    success_msg: >-
      IP 质量门禁通过: {{ (ipquality_verdict.stdout | from_json).summary.passed }}
      个出口全部达标
    quiet: true
  when:
    - ipquality_enabled | bool
    - ipquality_fail_on_violation | bool
  no_log: true
