---
- name: 拒绝在 check 模式下执行破坏性重装 (Fail if check mode)
  ansible.builtin.fail:
    msg: "vps.ops.os_reinstall is a destructive operational role and cannot be run in check mode."
  when: ansible_check_mode | bool

- name: 严格限制单主机执行范围 (Guard single host scope)
  ansible.builtin.assert:
    that:
      - (ansible_play_hosts_all | length) == 1
    fail_msg: >-
      vps.ops.os_reinstall 严禁并发或批量执行。ansible_play_hosts_all 必须且仅能包含 1 台主机，当前为 {{ ansible_play_hosts_all | length }} 台 ({{ ansible_play_hosts_all | join(', ') }})。
    quiet: true

- name: 校验操作员外部备份恢复就绪声明 (Assert operator backup prerequisite declaration)
  ansible.builtin.assert:
    that:
      - os_reinstall_backup_operator_ack is defined
      - (os_reinstall_backup_operator_ack | trim) == inventory_hostname
    fail_msg: >-
      [BACKUP PREREQUISITE] 目标主机 '{{ inventory_hostname }}' 即将被彻底格式化重装。
      必须显式传递 -e os_reinstall_backup_operator_ack='{{ inventory_hostname }}'，
      作为操作员对该主机外部备份已就绪、具备控制台/异地恢复手段的责任声明。
    quiet: true

- name: 交互式要求操作员输入确切主机名确认物理抹盘重装 (Interactive TTY Confirmation)
  ansible.builtin.pause:
    prompt: >-
      [CRITICAL WARNING] Bare-metal OS reinstallation will permanently destroy all data on '{{ inventory_hostname }}'.
      To confirm, type the exact hostname:
  register: _os_reinstall_pause_input

- name: 严格断言操作员当次输入与目标主机名一致 (Fail closed on non-TTY or mismatch)
  ansible.builtin.assert:
    that:
      - _os_reinstall_pause_input.user_input is defined
      - (_os_reinstall_pause_input.user_input | trim) == inventory_hostname
    fail_msg: >-
      [CONFIRMATION REJECTED] 输入的主机名与当前目标主机 '{{ inventory_hostname }}' 不匹配（在非交互式/非TTY环境或直接按回车将收到空输入并被安全阻断）。输入值为: '{{ _os_reinstall_pause_input.user_input | default('') }}'
    quiet: true

- name: 校验 SSH 公钥非空且格式合法 (Validate SSH public key)
  ansible.builtin.assert:
    that:
      - os_reinstall_ssh_pubkey is defined
      - os_reinstall_ssh_pubkey | trim | length > 0
      - >-
        os_reinstall_ssh_pubkey is regex('^(ssh-(ed25519|rsa|dss)|ecdsa-sha2-[a-z0-9-]+|sk-ssh-ed25519@openssh\.com|sk-ecdsa-sha2-[a-z0-9-]+@openssh\.com)\s+[A-Za-z0-9+/=]+(\s+.*)?$')
    fail_msg: >-
      os_reinstall_ssh_pubkey 必须是非空且合法的 SSH 公钥（例如 ssh-ed25519 AAAA...）。
    quiet: true

- name: 校验目标 Debian 版本与基础参数 (Validate parameters)
  ansible.builtin.assert:
    that:
      - os_reinstall_debian_version in ['12', '13']
      - os_reinstall_username | trim | length > 0
      - os_reinstall_ssh_port | int > 0
      - os_reinstall_ssh_port | int <= 65535
    fail_msg: "Debian 版本必须为 12 或 13，端口范围 1-65535，用户名非空。"
    quiet: true
