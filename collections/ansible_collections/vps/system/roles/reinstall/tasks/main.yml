---
- name: 角色启用检查
  ansible.builtin.debug:
    msg: "Role reinstall is disabled, skipping"
  when: not (auroraops_roles['system']['reinstall'] | default(false) | bool)
  tags: [deploy, system, reinstall, phase0]

- name: 执行重装前确认
  ansible.builtin.pause:
    prompt: "{{ reinstall_warning_msg }}\n\n⚠️  PROCEED WITH REINSTALL? (y/N): "
  register: reinstall_confirm_reinstall
  when: auroraops_roles['system']['reinstall'] | default(false) | bool
  tags: [deploy, system, reinstall, phase0]

- name: 终止任务（未确认）
  ansible.builtin.meta: end_host
  when:
    - auroraops_roles['system']['reinstall'] | default(false) | bool
    - reinstall_confirm_reinstall.user_input | default('') | lower != 'y'
  tags: [deploy, system, reinstall, phase0]

- name: 下载重装脚本
  ansible.builtin.get_url:
    url: "{{ reinstall_script_url }}"
    dest: /tmp/auroraops-reinstall.sh
    mode: "0755"
  when:
    - auroraops_roles['system']['reinstall'] | default(false) | bool
    - reinstall_confirm_reinstall.user_input | default('') | lower == 'y'
  tags: [deploy, system, reinstall, phase0]

- name: 执行重装脚本 (交互式引导)
  ansible.builtin.command:
    argv:
      - /tmp/auroraops-reinstall.sh
  changed_when: true
  when:
    - auroraops_roles['system']['reinstall'] | default(false) | bool
    - reinstall_confirm_reinstall.user_input | default('') | lower == 'y'
  tags: [deploy, system, reinstall, phase0]
